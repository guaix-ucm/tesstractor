[photometer_sqm]
model: SQM-LU
name: test_sqm1
# /dev/ttyUSB* names may change when the photometers are connected again,
# the names in /dev/serial/by-id/ do not, for example
# /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_<serial>-if00-port0
port: /dev/ttyUSB0
# description for the file header, left empty if not given
# filter: HOYA CM-500
# fov: 20
# azimuth: 0
# altitude: 90
# cover_offset: -0.11
enabled: False

[photometer_tess]
model: TESS-R
name: test-tessr1
port: /dev/ttyUSB0
# the TESS does not report its MAC address
# mac: AA:BB:CC:DD:EE:FF
enabled: False

[location]
contact_name: My Name
organization: My Organization
locality: My Location
province: My Province
country: ZZ
site: simulated
latitude: 40.4189
longitude: -3.6919
elevation: 650
timezone: CET
timesync: NTP

[mqtt]
username: tess
password: xxxxxxxxx
hostname: hostname
port: 1883
tls: False
register_topic: STARS4ALL/register
publish_topic: STARS4ALL/{name}/reading
enabled: False

[file]
dirname: /var/lib/tesstractor
# seconds to average the measurements, 0 writes every measurement
# as given by the photometer (one each tsample seconds)
interval: 300.0
enabled: False
