name: Build and upload to PyPI

# Run on published release
on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build and test the distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm takes the version from the tag
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Test the wheel
        run: |
          python -m pip install "$(ls dist/*.whl)[test]"
          python -m pytest -p no:cacheprovider -o asyncio_mode=auto --pyargs tesstractor

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: the publisher is configured in pypi.org with
    # repository guaix-ucm/tesstractor, workflow publish-pypi.yml and
    # environment pypi
    environment:
      name: pypi
      url: https://pypi.org/p/tesstractor
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
